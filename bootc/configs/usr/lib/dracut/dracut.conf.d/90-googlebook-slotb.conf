# Slot B budget: vendor_boot_b is 32 MiB and init_boot_b is 8 MiB, so the GPU, Wi-Fi,
# Bluetooth and SoundWire stacks are all omitted from the initramfs and brought up from
# the real root instead. 20-bootc-base.conf already adds the "ostree" and "bootc" dracut
# modules, which Slot B needs in order to act on the ostree= kernel argument.
omit_drivers+=" i915 xe amdgpu radeon nouveau cxgb4 iwlwifi iwlmld btintel btintel_pcie bluetooth cfg80211 mac80211 snd snd_sof snd_sof_pci_intel_ptl soundwire_bus intel_vpu "
add_drivers+=" nvme nvme_core btrfs uas usb_storage coreboot_table framebuffer-coreboot cros_ec cros_ec_lpcs cros_ec_keyb "
compress="zstd -19 -T0"
