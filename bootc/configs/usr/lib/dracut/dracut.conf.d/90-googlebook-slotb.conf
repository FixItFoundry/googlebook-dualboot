# Slot B budget: vendor_boot_b is 32 MiB and init_boot_b is 8 MiB, so the GPU, Wi-Fi,
# Bluetooth and SoundWire stacks are all omitted from the initramfs and brought up from
# the real root instead. 20-bootc-base.conf already adds the "ostree" and "bootc" dracut
# modules, which Slot B needs in order to act on the ostree= kernel argument.
#
# erofs, overlay and loop are pinned in add_drivers because ostree-prepare-root mounts /usr
# as a composefs - an EROFS image composed through overlayfs - and does it with
# fsopen("erofs"), which returns ENODEV if the filesystem type is not registered. 50ostree
# does instmods erofs overlay, but through instmods' optional path, which swallows failures;
# naming them here is unconditional. loop is the pre-fsopen fallback libcomposefs uses on
# kernels without the new mount API. Together about 200 KB, and googlebook-pack-slotb now
# refuses to pack an ostree deployment whose initramfs lacks the first two.
omit_drivers+=" i915 xe amdgpu radeon nouveau cxgb4 iwlwifi iwlmld btintel btintel_pcie bluetooth cfg80211 mac80211 snd snd_sof snd_sof_pci_intel_ptl soundwire_bus intel_vpu "
add_drivers+=" nvme nvme_core btrfs uas usb_storage coreboot_table framebuffer-coreboot cros_ec cros_ec_lpcs cros_ec_keyb erofs overlay loop "
# filesystems+= is a second, independent instmods batch (dracut line 2138) from the one
# add_drivers goes through (line 2124). Naming erofs and overlay in both means a failure in
# either path still leaves /usr mountable. Verified: with a deliberately unresolvable name in
# add_drivers, the filesystems+= copies still land.
filesystems+=" erofs overlay "
# sync is coreutils, and nothing in the initramfs pulls it in: googleboot-scan calls it
# before every kexec, after googlebook-sysroot-sync has just written modules and firmware
# into /sysroot. Optional so a distro without it at this path still packs.
install_optional_items+=" /usr/bin/sync "
compress="zstd -19 -T0"
