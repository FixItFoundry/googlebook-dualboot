# Chrome EC over ISHTP: Fedora does not build cros_ec_ishtp, so sensor-mods/ supplies it.
# The ISH firmware blob has to ride along in the initramfs because intel_ish_ipc requests
# it before the real root is mounted.
add_drivers+=" intel_ish_ipc cros_ec_ishtp cros_ec_sensors cros_ec_lid_angle cros_ec_keyb "
install_items+=" /lib/firmware/intel/ish/ish_ptl_62b0f067_501de2f8.bin "
