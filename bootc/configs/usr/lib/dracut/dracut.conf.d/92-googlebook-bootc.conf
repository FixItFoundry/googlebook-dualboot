# Slot B budget on an image-based system.
#
# fedora-bootc's own drop-ins build a deliberately generic initramfs: 20-bootc-base.conf
# adds the ostree and bootc modules (which Slot B genuinely needs), but 30-bootc-standard
# adds lvm, crypt and fips, 22-bootc-generic adds virtiofs, and 49-bootc-tpm2-tss and
# 50-bootc-clevis add the whole TPM2 and Clevis unlock stack. That is right for a server
# fleet and wrong here: vendor_boot_b is 32 MiB and init_boot_b is 8 MiB, and on Moonstone
# the root is a local NVMe Btrfs subvolume with no LVM, no network root and no Clevis.
# Measured at 46% off a comparable build.
#
# The filename matters. googlebook-pack-slotb writes its own
# /etc/dracut.conf.d/90-googlebook-slotb.conf, and dracut resolves conf.d files by
# basename with /etc winning over /usr/lib - so anything added to a 90- or 91- file here
# would be silently shadowed at pack time. 92- is a name the packer never writes, and it
# sorts last.
#
# Kept on purpose: btrfs, dm, crypt and systemd-cryptsetup, because googleboot-menu offers
# a LUKS2 passphrase unlock and the packer turns /etc/crypttab into rd.luks.uuid=. Only the
# unattended unlock mechanisms (Clevis, TPM2, FIDO2, PKCS#11) are dropped.
omit_dracutmodules+=" clevis clevis-pin-file clevis-pin-null clevis-pin-sss clevis-pin-tang clevis-pin-tpm2 tpm2-tss fido2 pkcs11 "
# systemd-pcrphase hard-depends on tpm2-tss, so omitting tpm2-tss alone leaves dracut
# printing "Module 'systemd-pcrphase' depends on module 'tpm2-tss', which can't be
# installed" twice per run. It skips the module and carries on either way - these are
# dracut[E] lines but not failures - so this is noise suppression, not a size fix. Measuring
# PCRs is pointless here regardless: Depthcharge, not systemd-boot, loads this kernel.
omit_dracutmodules+=" systemd-pcrphase "
omit_dracutmodules+=" lvm mdraid nvdimm "
omit_dracutmodules+=" qemu qemu-net virtiofs walinuxagent "
omit_dracutmodules+=" nfs cifs iscsi nvmf lunmask "
omit_dracutmodules+=" network network-manager net-lib prefixdevname "
omit_dracutmodules+=" fips fips-crypto-policies "
omit_dracutmodules+=" resume memstrack "
# plymouth is already defeated at pack time - install-into-initramfs.sh deletes its
# sysinit.target.wants link so it cannot take DRM master before googleboot-menu draws - so
# carrying its binaries, themes and fonts buys nothing. "quiet rhgb" on the command line
# becomes a no-op, which is what we want.
omit_dracutmodules+=" plymouth "
# i18n pulls console fonts and the full keymap set; the boot menu draws its own text and
# the only keyboard input before switch-root is a LUKS passphrase.
omit_dracutmodules+=" i18n "
