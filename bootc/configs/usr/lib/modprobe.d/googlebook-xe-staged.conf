# Intel Panther Lake Xe2 is staged: googlebook-gpu-init.service loads xe.ko only after
# /usr/lib/firmware/xe/* is reachable on the real root. Loading it from the initramfs
# wedges the display before googleboot-menu can draw.
blacklist i915
blacklist xe
options xe gsc_firmware_path="" huc_firmware_path="" wedged_mode=0 enable_psr=0
options spi_intel_pci writeable=1
