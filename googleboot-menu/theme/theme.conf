# GoogleBoot Graphical Bootloader Theme Configuration
# Live-loaded from /boot/googlebook-theme/theme.conf on nvme0n1p31 (linux_boot).
# Edit any value here without needing to reflash Slot B!

title               = GOOGLEBOOK // MOONSTONE
subtitle            = SELECT OPERATING SYSTEM   -   COREBOOT + KEXEC UNIVERSAL BOOTLOADER
font_family         = JetBrains Mono, Inter, Sans
background_image    = /boot/googlebook-theme/background.png
icon_dir            = /boot/googlebook-theme/icons

# Background gradient (used when background_image is absent)
bg_top_color        = #080C14
bg_bottom_color     = #111827

# Card styling (2880x1800 native OLED scale)
card_color          = #1E293B
card_alpha          = 0.72
card_selected_color = #172B4D
card_selected_alpha = 0.94
accent_color        = #38BDF8
text_color          = #F8FAFC
subtext_color       = #94A3B8

card_width          = 560
card_height         = 560
card_radius         = 28
card_gap            = 48

# Auto-boot countdown in seconds (0 = disable auto-boot)
timeout             = 6
