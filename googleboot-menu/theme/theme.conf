# Googlebook OS (ChromeOS / Aluminum OS Material 3 Dark) Bootloader Theme
# Live-loaded from /boot/googlebook-theme/theme.conf on nvme0n1p11 (linux_boot).
# Edit any value here without needing to reflash Slot B!

title               = Googlebook
subtitle            = Select an operating system to start

# Googlebook OS Material 3 Dark surface background
bg_top_color        = #202124
bg_bottom_color     = #1B1C1F

# Material 3 Dark surface cards (2880x1800 native OLED scale)
card_color          = #292A2D
card_alpha          = 1.00
card_selected_color = #303134
card_selected_alpha = 1.00
accent_color        = #8AB4F8
text_color          = #E8EAED
subtext_color       = #9AA0A6

card_width          = 540
card_height         = 560
card_radius         = 28
card_gap            = 44

# Auto-boot countdown in seconds (0 = disable auto-boot)
timeout             = 3
