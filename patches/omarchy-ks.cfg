# Fedomakase Kickstart — Fedora Everything Netinstall (omarchy-ks.cfg)
#
# Flow: GRUB passes inst.ks=cdrom:/omarchy-ks.cfg -> Anaconda runs %pre first,
# which launches the Gum TUI on TTY3. The TUI writes /tmp/fedomakase-part.cfg,
# which is consumed by the %include below (the documented Red Hat pattern for
# %pre-generated partitioning includes). Everything user-chosen (keyboard,
# disk, LUKS, username, password, hostname, timezone) flows through that
# include — there are NO hardcoded credentials in this file. If %pre fails,
# install aborts loudly.

# System Language (keyboard, timezone, and network/hostname come from %include)
lang en_US.UTF-8

# Text mode so errors are visible on console instead of hidden behind GUI
text
firstboot --disable
reboot

# Software Repositories (synced with install/omarchy-fedora-copr.repos)
url --mirrorlist="https://mirrors.fedoraproject.org/mirrorlist?repo=fedora-44&arch=x86_64"
repo --name="fedora-updates" --mirrorlist="https://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f44&arch=x86_64"
repo --name="copr-nett00n" --baseurl="https://copr-be.cloud.fedoraproject.org/results/nett00n/hyprland/fedora-44-x86_64/"
repo --name="copr-whelanh" --baseurl="https://copr-be.cloud.fedoraproject.org/results/whelanh/omarchy/fedora-44-x86_64/"
repo --name="copr-ghostty" --baseurl="https://copr-be.cloud.fedoraproject.org/results/scottames/ghostty/fedora-44-x86_64/"
repo --name="copr-atim-starship" --baseurl="https://copr-be.cloud.fedoraproject.org/results/atim/starship/fedora-44-x86_64/"
repo --name="copr-boobaa-lazygit" --baseurl="https://copr-be.cloud.fedoraproject.org/results/boobaa/lazygit/fedora-44-x86_64/"
repo --name="copr-jdxcode-mise" --baseurl="https://copr-be.cloud.fedoraproject.org/results/jdxcode/mise/fedora-44-x86_64/"
repo --name="copr-anudeepd-localsend" --baseurl="https://copr-be.cloud.fedoraproject.org/results/anudeepd/localsend/fedora-44-x86_64/"
repo --name="copr-brycensranch-gsr" --baseurl="https://copr-be.cloud.fedoraproject.org/results/brycensranch/gpu-screen-recorder-git/fedora-44-x86_64/"
repo --name="copr-lecris-moonlight" --baseurl="https://copr-be.cloud.fedoraproject.org/results/lecris/moonlight/fedora-44-x86_64/"
repo --name="copr-alternateved-keyd" --baseurl="https://copr-be.cloud.fedoraproject.org/results/alternateved/keyd/fedora-44-x86_64/"

# -------------------------------------------------------------------------
# PRE-INSTALL: interactive Gum UI on TTY3 gathers all user choices and
# writes /tmp/fedomakase-part.cfg (consumed by %include below).
# -------------------------------------------------------------------------
%pre --interpreter=/bin/bash --erroronfail
echo "[Fedomakase] %pre started at $(date)" > /tmp/fedomakase-pre.log
echo "[Fedomakase] Kernel cmdline: $(cat /proc/cmdline)" >> /tmp/fedomakase-pre.log

# Ensure sshd is running for remote autonomous control
systemctl start sshd.service 2>/dev/null || /usr/bin/sshd 2>/dev/null || /usr/sbin/sshd 2>/dev/null || true

if [ -c /dev/tty3 ]; then
    exec < /dev/tty3 > /dev/tty3 2>&1
    chvt 3
fi
printf '\033[2J\033[H'

export TERM=linux
INSTALLER_PATH=""
for path in \
  /tmp/omarchy-fedora/installer/omarchy-installer.sh \
  /run/install/repo/omarchy-fedora/installer/omarchy-installer.sh \
  /run/install/source/omarchy-fedora/installer/omarchy-installer.sh \
  /run/install/isodir/omarchy-fedora/installer/omarchy-installer.sh \
  /run/install/sources/mount-0000-cdrom/omarchy-fedora/installer/omarchy-installer.sh; do
  if [ -f "$path" ]; then
    INSTALLER_PATH="$path"
    break
  fi
done

if [ -z "$INSTALLER_PATH" ]; then
  STAGE2_URL=$(sed -n 's/.*inst\.stage2=\([^ ]*\).*/\1/p' /proc/cmdline | head -n 1)
  case "$STAGE2_URL" in
    http://*|https://*)
      echo "Fetching omarchy-fedora payload from $STAGE2_URL/omarchy-fedora.tar.gz..."
      mkdir -p /run/install/repo /tmp
      if curl -fsSL "$STAGE2_URL/omarchy-fedora.tar.gz" | tar -xz -C /tmp; then
        cp -rf /tmp/omarchy-fedora /run/install/repo/ 2>/dev/null || true
        INSTALLER_PATH="/tmp/omarchy-fedora/installer/omarchy-installer.sh"
      fi
      ;;
  esac
fi

if [ -n "$INSTALLER_PATH" ]; then
  PAYLOAD_ROOT="$(cd "$(dirname "$INSTALLER_PATH")/.." && pwd)"
  if [ "$PAYLOAD_ROOT" != "/tmp/omarchy-fedora" ] && [ ! -d /tmp/omarchy-fedora ]; then
    cp -rf "$PAYLOAD_ROOT" /tmp/omarchy-fedora 2>/dev/null || true
  fi
  export PATH="$PATH:$(dirname "$INSTALLER_PATH")"
  if ! bash "$INSTALLER_PATH" && [ ! -s /tmp/fedomakase-part.cfg ]; then
    echo "Installer was aborted or failed. Rebooting in 5 seconds..."
    sleep 5
    reboot
  fi
else
  echo "Installer script not found in any standard Anaconda mount paths (/run/install/*)"
  sleep 5
  poweroff -f
fi

# Sanity: the include file MUST exist or the kickstart cannot continue
if [ ! -s /tmp/fedomakase-part.cfg ]; then
  echo "ERROR: installer did not produce /tmp/fedomakase-part.cfg"
  sleep 5
  reboot
fi

chvt 1
%end

# Keyboard / timezone / network / partitioning / disk / user — determined by Gum choices.
%include /tmp/fedomakase-part.cfg

# bootloader line is generated by omarchy-installer.sh into /tmp/fedomakase-part.cfg
# (Googlebook/depthcharge: --location=none; Slot B is packed in %post instead)
rootpw --lock

