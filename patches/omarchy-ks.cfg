# -------------------------------------------------------------------------
# POST-INSTALL (NO CHROOT): copy payload + Gum choices into the target system
# -------------------------------------------------------------------------
%post --nochroot --log=/mnt/sysimage/var/log/fedomakase-copy.log
echo "[Fedomakase] Copying Omarchy payload from ISO/staging to sysimage..."
PAYLOAD_SRC=""
for dir in \
  /tmp/omarchy-fedora \
  /run/install/repo/omarchy-fedora \
  /run/install/source/omarchy-fedora \
  /run/install/isodir/omarchy-fedora \
  /run/install/sources/mount-0000-cdrom/omarchy-fedora \
  /run/install/sources/mount-*/omarchy-fedora; do
  if [ -d "$dir" ] && [ -f "$dir/config/hypr/hyprland.lua" ]; then
    PAYLOAD_SRC="$dir"
    break
  fi
done

if [ -n "$PAYLOAD_SRC" ]; then
  echo "[Fedomakase] Found payload at $PAYLOAD_SRC"
  mkdir -p /mnt/sysimage/usr/share/omarchy
  cp -rf "$PAYLOAD_SRC"/. /mnt/sysimage/usr/share/omarchy/
else
  STAGE2_URL=$(sed -n 's/.*inst\.stage2=\([^ ]*\).*/\1/p' /proc/cmdline | head -n 1)
  case "$STAGE2_URL" in
    http://*|https://*)
      echo "[Fedomakase] Fetching omarchy-fedora.tar.gz from $STAGE2_URL..."
      mkdir -p /tmp /mnt/sysimage/usr/share/omarchy
      if curl -fsSL "$STAGE2_URL/omarchy-fedora.tar.gz" | tar -xz -C /tmp; then
        cp -rf /tmp/omarchy-fedora/. /mnt/sysimage/usr/share/omarchy/
      fi
      ;;
    *)
      echo "WARNING: omarchy-fedora payload directory not found on install media!"
      ;;
  esac
fi

# Relay Gum choices into the chroot for %post (chroot) consumption
if [ -f /tmp/fedomakase-part.cfg ]; then
  cp /tmp/fedomakase-part.cfg /mnt/sysimage/root/fedomakase-part.cfg
fi
if [ -f /tmp/fedomakase-pre.log ]; then
  cp /tmp/fedomakase-pre.log /mnt/sysimage/root/fedomakase-pre.log || true
fi
if [ -f /tmp/fedomakase-input-method ]; then
  mkdir -p /mnt/sysimage/etc/omarchy
  cp /tmp/fedomakase-input-method /mnt/sysimage/etc/omarchy/input-method
  chmod 644 /mnt/sysimage/etc/omarchy/input-method
fi
if [ -f /tmp/fedomakase-git-identity ]; then
  cp /tmp/fedomakase-git-identity /mnt/sysimage/root/fedomakase-git-identity
  chmod 600 /mnt/sysimage/root/fedomakase-git-identity
fi
# LUKS passphrase (only exists if encryption was chosen) — needed once by
# systemd-cryptenroll in chrooted %post, wiped immediately afterwards.
if [ -f /tmp/fedomakase-luks-pass ]; then
  cp /tmp/fedomakase-luks-pass /mnt/sysimage/root/fedomakase-luks-pass
  chmod 600 /mnt/sysimage/root/fedomakase-luks-pass
fi
%end

# -------------------------------------------------------------------------
# POST-INSTALL (CHROOT): configure the installed system
# -------------------------------------------------------------------------
%post --log=/var/log/fedomakase-install.log

echo "[Fedomakase] Starting post-install configuration..."

CHOICE_FILE="/root/fedomakase-part.cfg"
CHOSEN_USER="omarchy"
if [ -f "$CHOICE_FILE" ]; then
  CHOSEN_USER=$(sed -n 's/^user .*--name=\([^ ]*\).*/\1/p' "$CHOICE_FILE" | head -n 1)
  [ -z "$CHOSEN_USER" ] && CHOSEN_USER="omarchy"
fi
echo "[Fedomakase] Chosen user: $CHOSEN_USER"

OMARCHY_USER_NAME=""
OMARCHY_USER_EMAIL=""
if [ -f /root/fedomakase-git-identity ]; then
  # shellcheck disable=SC1091
  source /root/fedomakase-git-identity || true
  rm -f /root/fedomakase-git-identity
fi
export OMARCHY_USER_NAME OMARCHY_USER_EMAIL

# 1. Enable System Services
systemctl enable sddm.service
systemctl enable sshd.service 2>/dev/null || true
systemctl enable NetworkManager.service
systemctl enable bluetooth.service
systemctl enable docker.service
systemctl enable docker.socket
systemctl enable power-profiles-daemon.service
systemctl enable cups.service
systemctl enable avahi-daemon.service
systemctl enable systemd-resolved.service
systemctl enable systemd-oomd.service 2>/dev/null || true
systemctl mask NetworkManager-wait-online.service
systemctl set-default graphical.target

# 2. Configure Flathub
flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true

# 3. Seed Omarchy Configurations & Run Upstream Orchestration
if [ -d /usr/share/omarchy ]; then
  chmod +x /usr/share/omarchy/bin/* /usr/share/omarchy/installer/* 2>/dev/null || true
  mkdir -p /usr/bin /usr/local/bin
  for f in /usr/share/omarchy/bin/*; do
    [ -f "$f" ] || continue
    bn="${f##*/}"
    ln -sf "/usr/share/omarchy/bin/$bn" "/usr/bin/$bn"
    ln -sf "/usr/share/omarchy/bin/$bn" "/usr/local/bin/$bn"
  done
  ln -sf /usr/local/bin/googlebook-switch-slot /usr/local/bin/boot-android 2>/dev/null || true

  # Ensure env-bootstrap always puts /usr/share/omarchy/bin in PATH and is sourced by /etc/profile.d
  if [ -f /usr/share/omarchy/default/bash/env-bootstrap ]; then
    cat > /usr/share/omarchy/default/bash/env-bootstrap << 'ENVBOOTEOF'
# System-wide Omarchy environment bootstrap.
export OMARCHY_PATH="${OMARCHY_PATH:-/usr/share/omarchy}"
case ":$PATH:" in
  *":${OMARCHY_PATH%/}/bin:"*) ;;
  *) export PATH="${OMARCHY_PATH%/}/bin:$PATH" ;;
esac
case ":$PATH:" in
  *":$HOME/.local/bin:"*) ;;
  *) [ -n "${HOME:-}" ] && export PATH="$HOME/.local/bin:$PATH" ;;
esac
ENVBOOTEOF
    chmod 644 /usr/share/omarchy/default/bash/env-bootstrap
    mkdir -p /etc/profile.d
    ln -sf /usr/share/omarchy/default/bash/env-bootstrap /etc/profile.d/omarchy.sh
  fi

  # System drop-ins
  if [ -d /usr/share/omarchy/etc ]; then
    cp -rf /usr/share/omarchy/etc/. /etc/
  fi

  # SDDM theme & Wayland greeter config
  if [ -d /usr/share/omarchy/default/sddm/omarchy ]; then
    mkdir -p /usr/share/sddm/themes
    cp -rf /usr/share/omarchy/default/sddm/omarchy /usr/share/sddm/themes/omarchy
    if [ -f /usr/share/sddm/themes/omarchy/Main.qml ]; then
      sed -i 's/name\.indexOf("uwsm") !== -1/name.indexOf("Omarchy") !== -1 || name.indexOf("uwsm") !== -1/' /usr/share/sddm/themes/omarchy/Main.qml 2>/dev/null || true
    fi
  fi
  if [ -f /usr/share/omarchy/default/sddm/hyprland.lua ]; then
    mkdir -p /usr/share/sddm
    cp -f /usr/share/omarchy/default/sddm/hyprland.lua /usr/share/sddm/hyprland.lua
  fi
  rm -rf /var/lib/sddm/.config/hypr 2>/dev/null || true

  # UWSM, environment.d, systemd user units, zram-generator, plymouth
  mkdir -p /usr/share/uwsm/env.d
  if [ -f /usr/share/omarchy/default/uwsm/default ]; then
    cp -f /usr/share/omarchy/default/uwsm/default /usr/share/uwsm/default
  fi
  for uwsm_src in /usr/share/omarchy/default/uwsm/env.d/10-omarchy /usr/share/omarchy/default/uwsm/env.d/omarchy; do
    if [ -f "$uwsm_src" ]; then
      cp -f "$uwsm_src" /usr/share/uwsm/env.d/10-omarchy
      sed -i 's|omarchy-cmd-present mise && eval "\$(mise activate bash --shims)".*|omarchy-cmd-present mise \&\& eval "\$(mise activate bash --shims)" \|\| true|' /usr/share/uwsm/env.d/10-omarchy
      break
    fi
  done

  mkdir -p /usr/lib/environment.d /etc/environment.d /usr/lib/systemd/user/app.slice.d /usr/lib/systemd/zram-generator.conf.d /usr/share/plymouth/themes
  cp -f /usr/share/omarchy/default/environment.d/*.conf /usr/lib/environment.d/ 2>/dev/null || true
  cp -f /usr/share/omarchy/default/environment.d/*.conf /etc/environment.d/ 2>/dev/null || true
  cp -f /usr/share/omarchy/default/systemd/user/*.service /usr/lib/systemd/user/ 2>/dev/null || true
  cp -f /usr/share/omarchy/default/systemd/user/app.slice.d/10-oomd.conf /usr/lib/systemd/user/app.slice.d/10-oomd.conf 2>/dev/null || true
  cp -f /usr/share/omarchy/default/systemd/zram-generator.conf.d/90-omarchy.conf /usr/lib/systemd/zram-generator.conf.d/90-omarchy.conf 2>/dev/null || true
  cp -rf /usr/share/omarchy/default/plymouth /usr/share/plymouth/themes/omarchy 2>/dev/null || true

  # Wayland sessions (uwsm-managed omarchy.desktop)
  if [ -d /usr/share/omarchy/default/wayland-sessions ]; then
    mkdir -p /usr/share/wayland-sessions
    cp -rf /usr/share/omarchy/default/wayland-sessions/. /usr/share/wayland-sessions/
    rm -f /usr/share/wayland-sessions/hyprland-uwsm.desktop 2>/dev/null || true
  fi

  # Fonts shipped with the tree
  if [ -d /usr/share/omarchy/default/fonts ]; then
    mkdir -p /usr/share/fonts/omarchy
    cp -rf /usr/share/omarchy/default/fonts/. /usr/share/fonts/omarchy/ 2>/dev/null || true
    fc-cache -f 2>/dev/null || true
  fi

  # Fontconfig defaults
  if [ -d /usr/share/omarchy/default/fontconfig ]; then
    mkdir -p /etc/fonts/conf.d
    cp -rf /usr/share/omarchy/default/fontconfig/. /etc/fonts/conf.d/ 2>/dev/null || true
  fi

  # System-wide application entries
  if [ -d /usr/share/omarchy/default/applications ]; then
    mkdir -p /usr/share/applications
    cp -rf /usr/share/omarchy/default/applications/. /usr/share/applications/ 2>/dev/null || true
  fi

  # Default terminal preference for xdg-terminal-exec
  if [ -f /usr/share/omarchy/default/xdg-terminal-exec/hyprland-xdg-terminals.list ]; then
    mkdir -p /etc/xdg
    cp /usr/share/omarchy/default/xdg-terminal-exec/hyprland-xdg-terminals.list /etc/xdg/xdg-terminals.list
  fi

  # plocate updatedb drop-in (index Btrfs subvolumes, skip /.snapshots)
  if [ -f /usr/share/omarchy/default/systemd/system/plocate-updatedb.service.d/10-omarchy.conf ]; then
    mkdir -p /usr/lib/systemd/system/plocate-updatedb.service.d
    cp /usr/share/omarchy/default/systemd/system/plocate-updatedb.service.d/10-omarchy.conf \
       /usr/lib/systemd/system/plocate-updatedb.service.d/10-omarchy.conf
  fi

  # Ensure omarchy-apply-fedora-patches keeps SDDM's dedicated greeter hyprland.lua
  if [ -f /usr/share/omarchy/bin/omarchy-apply-fedora-patches ]; then
    sed -i 's|CompositorCommand=uwsm start -e -D Hyprland hyprland.desktop|CompositorCommand=Hyprland --config /usr/share/sddm/hyprland.lua|g' /usr/share/omarchy/bin/omarchy-apply-fedora-patches 2>/dev/null || true
    sed -i 's|grep -q "uwsm start" "\$sddm_wayland"|grep -q "/usr/share/sddm/hyprland.lua" "\$sddm_wayland"|g' /usr/share/omarchy/bin/omarchy-apply-fedora-patches 2>/dev/null || true
  fi

  # Ensure mise-work.sh and mise.sh do not abort offline chroot provisioning
  if [ -f /usr/share/omarchy/install/user/mise-work.sh ]; then
    sed -i 's/exit 1/echo "Warning: Node.js tarball not bundled; skipping offline Node install" >\&2/' /usr/share/omarchy/install/user/mise-work.sh
  fi
  if [ -f /usr/share/omarchy/install/user/mise.sh ]; then
    sed -i 's/\(omarchy-mise-install .*\)/\1 || true/' /usr/share/omarchy/install/user/mise.sh
    sed -i 's/^mise reshim$/mise reshim || true/' /usr/share/omarchy/install/user/mise.sh
  fi

  # Run Omarchy system-wide config & hardware leaves (including Intel & Googlebook Moonstone)
  export OMARCHY_PATH=/usr/share/omarchy
  export OMARCHY_INSTALL=/usr/share/omarchy/install
  export PATH="/usr/share/omarchy/bin:$PATH"
  for sys_script in theme-system.sh browser-policy.sh lockscreen-pam.sh increase-lockout-limit.sh fix-powerprofilesctl-shebang.sh ssh-command-path.sh ssh-keepalive.sh locale.sh snapper.sh; do
    if [ -f "/usr/share/omarchy/install/config/$sys_script" ]; then
      bash "/usr/share/omarchy/install/config/$sys_script" 2>/dev/null || true
    fi
  done
  if [ -x /usr/share/omarchy/bin/omarchy-apply-hardware ]; then
    /usr/share/omarchy/bin/omarchy-apply-hardware --install-user "$CHOSEN_USER" || true
  fi
  if [ -f /usr/share/omarchy/install/login/sddm.sh ]; then
    bash /usr/share/omarchy/install/login/sddm.sh || true
  fi

  # Apply Fedora patches & install self-healing post-update hook stash
  if [ -x /usr/share/omarchy/bin/omarchy-apply-fedora-patches ]; then
    /usr/share/omarchy/bin/omarchy-apply-fedora-patches || true
  fi

  # Complete /etc/skel population matching upstream omarchy-settings PKGBUILD
  mkdir -p /etc/skel/.config/omarchy/branding \
           /etc/skel/.config/autostart \
           /etc/skel/.local/state/omarchy/toggles/hypr \
           /etc/skel/.local/state/tensaku \
           /etc/skel/.local/share/nautilus-python/extensions
  cp -rf /usr/share/omarchy/config/. /etc/skel/.config/ 2>/dev/null || true
  cp -f /usr/share/omarchy/default/bashrc /etc/skel/.bashrc 2>/dev/null || true
  cp -f /usr/share/omarchy/logo.txt /etc/skel/.config/omarchy/branding/screensaver.txt 2>/dev/null || true
  cp -f /usr/share/omarchy/logo.txt /etc/skel/.config/omarchy/branding/about.txt 2>/dev/null || true
  cp -f /usr/share/omarchy/default/hypr/toggles/flags.lua /etc/skel/.local/state/omarchy/toggles/hypr/flags.lua 2>/dev/null || true
  cp -f /usr/share/omarchy/default/tensaku/state.toml /etc/skel/.local/state/tensaku/state.toml 2>/dev/null || true
  cp -f /usr/share/omarchy/default/nautilus-python/extensions/localsend.py /etc/skel/.local/share/nautilus-python/extensions/localsend.py 2>/dev/null || true
  cat << 'AUTOSTART_EOF' > /etc/skel/.config/autostart/omarchy-first-run.desktop
[Desktop Entry]
Type=Application
Name=Omarchy First Run Setup
Exec=/usr/share/omarchy/bin/omarchy-provision-first-run
Hidden=false
NoDisplay=true
X-GNOME-Autostart-enabled=true
AUTOSTART_EOF
  chmod -R a+rX /etc/skel

  # Per-user config seeding + Tokyo Night theme pre-seeding + omarchy-provision-user
  for user_dir in /home/*; do
    [ -d "$user_dir" ] || continue
    user_name=$(basename "$user_dir")
    [ "$user_name" = "lost+found" ] && continue
    rm -f "$user_dir/.config/hypr/hyprland.conf" 2>/dev/null || true
    cp -rf /etc/skel/. "$user_dir/" 2>/dev/null || true
    mkdir -p "$user_dir/.config/autostart" \
             "$user_dir/.local/share/applications" \
             "$user_dir/.local/share/icons" \
             "$user_dir/.local/state/omarchy/migrations"
    cp -rf /usr/share/omarchy/config/. "$user_dir/.config/"
    if [ -d /usr/share/omarchy/applications ]; then
      cp -rf /usr/share/omarchy/applications/*.desktop "$user_dir/.local/share/applications/" 2>/dev/null || true
      cp -rf /usr/share/omarchy/applications/icons/. "$user_dir/.local/share/icons/" 2>/dev/null || true
    fi
    if [ -d /usr/share/omarchy/themes/tokyo-night ]; then
      mkdir -p "$user_dir/.local/state/omarchy/current/theme" \
               "$user_dir/.config/btop/themes" \
               "$user_dir/.config/mako" \
               "$user_dir/.config/eza"
      cp -rf /usr/share/omarchy/themes/tokyo-night/. "$user_dir/.local/state/omarchy/current/theme/"
      printf 'tokyo-night\n' > "$user_dir/.local/state/omarchy/current/theme.name"
      first_bg=$(ls -1 "$user_dir/.local/state/omarchy/current/theme/backgrounds/"* 2>/dev/null | head -n 1)
      if [ -n "$first_bg" ]; then
        bg_bn=$(basename "$first_bg")
        ln -snf "/home/$user_name/.local/state/omarchy/current/theme/backgrounds/$bg_bn" "$user_dir/.local/state/omarchy/current/background"
      fi
      [ -f "$user_dir/.local/state/omarchy/current/theme/btop.theme" ] && cp -f "$user_dir/.local/state/omarchy/current/theme/btop.theme" "$user_dir/.config/btop/themes/current.theme"
      [ -f "$user_dir/.local/state/omarchy/current/theme/mako.ini" ] && cp -f "$user_dir/.local/state/omarchy/current/theme/mako.ini" "$user_dir/.config/mako/config"
      [ -f "$user_dir/.local/state/omarchy/current/theme/eza.yml" ] && cp -f "$user_dir/.local/state/omarchy/current/theme/eza.yml" "$user_dir/.config/eza/theme.yml"
    fi
    if [ -d /usr/share/omarchy/migrations ]; then
      for mig in /usr/share/omarchy/migrations/*.sh; do
        [ -f "$mig" ] || continue
        touch "$user_dir/.local/state/omarchy/migrations/$(basename "$mig")"
      done
    fi
    if [ -d /usr/share/omarchy/fedora-patches ]; then
      mkdir -p "$user_dir/.local/share/fedomakase/bin" "$user_dir/.local/share/fedomakase/fedora-patches" "$user_dir/.config/omarchy/hooks/post-update.d"
      cp -f /usr/share/omarchy/bin/omarchy-apply-fedora-patches "$user_dir/.local/share/fedomakase/bin/" 2>/dev/null || true
      cp -rf /usr/share/omarchy/fedora-patches/. "$user_dir/.local/share/fedomakase/fedora-patches/" 2>/dev/null || true
      cp -f /usr/share/omarchy/fedora-patches/apply-fedora-patches.hook "$user_dir/.config/omarchy/hooks/post-update.d/apply-fedora-patches.hook" 2>/dev/null || true
      chmod +x "$user_dir/.config/omarchy/hooks/post-update.d/apply-fedora-patches.hook" 2>/dev/null || true
    fi
    chown -R "$user_name:$user_name" "$user_dir" 2>/dev/null || true
    if [ -x /usr/share/omarchy/bin/omarchy-provision-user ]; then
      su - "$user_name" -c "OMARCHY_PATH=/usr/share/omarchy OMARCHY_SETUP_CONTEXT=provision-owner OMARCHY_USER_NAME=\"$OMARCHY_USER_NAME\" OMARCHY_USER_EMAIL=\"$OMARCHY_USER_EMAIL\" PATH=/usr/share/omarchy/bin:\$PATH /usr/share/omarchy/bin/omarchy-provision-user --force --first-install" || true
    fi
  done
fi

# 4. Pre-seed SDDM Wayland greeter config, autologin, and last-user state
mkdir -p /etc/sddm.conf.d /var/lib/sddm
cat << 'SDDM_WAYLAND_EOF' > /etc/sddm.conf.d/10-wayland.conf
[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=Hyprland --config /usr/share/sddm/hyprland.lua

[Theme]
Current=omarchy
SDDM_WAYLAND_EOF

cat << SDDM_AUTO_EOF > /etc/sddm.conf.d/autologin.conf
[Autologin]
User=${CHOSEN_USER}
Session=omarchy.desktop
SDDM_AUTO_EOF

cat << SDDM_STATE_EOF > /var/lib/sddm/state.conf
[Last]
User=${CHOSEN_USER}
Session=/usr/share/wayland-sessions/omarchy.desktop
SDDM_STATE_EOF
chown -R sddm:sddm /var/lib/sddm 2>/dev/null || true

# 5. Bootloader: quiet 1s hidden GRUB timeout + reboot-boot-menu sudoers rule + UEFI fallback
if [ -f /etc/default/grub ]; then
  sed -i 's/^GRUB_TIMEOUT=.*/GRUB_TIMEOUT=1/' /etc/default/grub
  if grep -q '^GRUB_TIMEOUT_STYLE=' /etc/default/grub; then
    sed -i 's/^GRUB_TIMEOUT_STYLE=.*/GRUB_TIMEOUT_STYLE=hidden/' /etc/default/grub
  else
    echo 'GRUB_TIMEOUT_STYLE=hidden' >> /etc/default/grub
  fi
  grub2-mkconfig -o /boot/grub2/grub.cfg 2>/dev/null || true
fi
if [ -d /boot/efi/EFI/fedora ]; then
  mkdir -p /boot/efi/EFI/BOOT
  [ -f /boot/efi/EFI/fedora/shimx64.efi ] && cp -f /boot/efi/EFI/fedora/shimx64.efi /boot/efi/EFI/BOOT/BOOTX64.EFI
  [ -f /boot/efi/EFI/fedora/grubx64.efi ] && cp -f /boot/efi/EFI/fedora/grubx64.efi /boot/efi/EFI/BOOT/grubx64.efi
  [ -f /boot/efi/EFI/fedora/mmx64.efi ] && cp -f /boot/efi/EFI/fedora/mmx64.efi /boot/efi/EFI/BOOT/mmx64.efi
  [ ! -f /boot/efi/EFI/BOOT/BOOTX64.EFI ] && [ -f /boot/efi/EFI/fedora/grubx64.efi ] && cp -f /boot/efi/EFI/fedora/grubx64.efi /boot/efi/EFI/BOOT/BOOTX64.EFI
fi
mkdir -p /etc/sudoers.d
echo '%wheel ALL=(root) NOPASSWD: /usr/bin/grub2-editenv - set menu_show_once=1' > /etc/sudoers.d/omarchy-grub-bootmenu
chmod 0440 /etc/sudoers.d/omarchy-grub-bootmenu

# 6. Nerd Font for QuickShell glyphs (JetBrains Mono NF not packaged in Fedora).
# ponytail: GitHub fetch instead of a COPR guess; swap to an RPM when one lands.
NF_DIR="/usr/share/fonts/omarchy/JetBrainsMono-NF"
if [ ! -d "$NF_DIR" ]; then
  echo "[Fedomakase] Fetching JetBrains Mono Nerd Font..."
  mkdir -p "$NF_DIR"
  curl -fsSL --max-time 60 \
    "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.tar.xz" \
    | tar -xJ -C "$NF_DIR" 2>/dev/null \
    && fc-cache -f 2>/dev/null \
    || echo "WARNING: Nerd Font download failed — icons may render blank until installed."
fi

# 7. TPM2 auto-unlock binding (only possible if LUKS was actually chosen)
echo "[Fedomakase] Checking for LUKS volume to bind to TPM2..."
luks_partition=$(lsblk -o NAME,FSTYPE -dn 2>/dev/null | grep crypto_LUKS | awk '{print $1}' | head -n 1)
if [ -n "$luks_partition" ]; then
  if [ -e /dev/tpmrm0 ]; then
    echo "Found encrypted partition /dev/$luks_partition — binding to TPM2 (PCRs 0+7)..."
    if systemctl is-active --quiet tpm2.target 2>/dev/null || [ -c /dev/tpmrm0 ]; then
      systemd-cryptenroll --tpm2-device=auto --tpm2-pcrs=0+7 \
        --unlock-keyfile=/root/fedomakase-luks-pass "/dev/$luks_partition" \
        && echo "TPM2 enrollment OK" \
        || echo "WARNING: TPM2 enrollment failed — passphrase prompt remains at boot."
    fi
    # Route boot-time unlock through the TPM
    mkdir -p /etc/dracut.conf.d
    echo 'add_dracutmodules+=" tpm2-tss "' > /etc/dracut.conf.d/tpm2.conf
    if [ -f /etc/crypttab ]; then
      luks_uuid=$(cryptsetup luksUUID "/dev/$luks_partition" 2>/dev/null || true)
      if [ -n "$luks_uuid" ] && ! grep -q "tpm2-device" /etc/crypttab; then
        sed -i "/$luks_uuid/s/$/ tpm2-device=auto/" /etc/crypttab
      fi
    fi
    dracut -f --regenerate-all || true
  else
    echo "No TPM2 device found — LUKS will prompt for passphrase at boot."
    echo "Enable TPM2 in BIOS/UEFI, then run: sudo omarchy-setup-tpm2-unlock"
  fi
  rm -f /root/fedomakase-luks-pass /tmp/fedomakase-luks-pass 2>/dev/null || true
fi

# 8. Icon theme compatibility symlinks + chromium initial prefs
mkdir -p /usr/share/icons/Yaru/scalable/actions
ln -snf /usr/share/icons/Adwaita/symbolic/actions/go-previous-symbolic.svg \
        /usr/share/icons/Yaru/scalable/actions/go-previous-symbolic.svg 2>/dev/null || true
ln -snf /usr/share/icons/Adwaita/symbolic/actions/go-next-symbolic.svg \
        /usr/share/icons/Yaru/scalable/actions/go-next-symbolic.svg 2>/dev/null || true
gtk-update-icon-cache /usr/share/icons/Yaru &>/dev/null || true
mkdir -p /etc/chromium/policies/managed /usr/lib/chromium
chmod a+rw /etc/chromium/policies/managed 2>/dev/null || true
echo '{"distribution":{"require_eula":false},"browser":{"theme":{"color_scheme":0,"color_scheme2":0}}}' > /usr/lib/chromium/initial_preferences

# 9. locate: index snapshots too
if [ -f /etc/updatedb.conf ]; then
  sed -i -E 's|^[[:space:]]*PRUNE_BIND_MOUNTS[[:space:]]*=.*|PRUNE_BIND_MOUNTS = "no"|' /etc/updatedb.conf 2>/dev/null || true
  if ! grep -q '/.snapshots' /etc/updatedb.conf 2>/dev/null; then
    sed -i -E 's|^(PRUNEPATHS[[:space:]]*=.*)|\1 "/.snapshots"|' /etc/updatedb.conf 2>/dev/null || true
  fi
fi

echo "[Fedomakase] Post-install configuration complete!"
%end

# Googlebook / depthcharge: pack the installed kernel into Android Slot B of the target disk
%post --log=/var/log/fedomakase-googlebook-slotb.log
if grep -qi coreboot /sys/class/dmi/id/bios_vendor 2>/dev/null && [ -x /usr/share/omarchy/bin/fedomakase-googlebook-slotb ]; then
  /usr/share/omarchy/bin/fedomakase-googlebook-slotb || echo "[googlebook-slotb] FAILED (non-fatal); re-run after first boot"
fi
%end
