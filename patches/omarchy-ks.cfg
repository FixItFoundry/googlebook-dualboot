# Fedomakase Kickstart — Fedora Everything Netinstall (omarchy-ks.cfg)
#
# Flow: GRUB passes inst.ks=cdrom:/omarchy-ks.cfg -> Anaconda runs %pre first,
# which launches the Omarchy TUI on TTY3. The TUI writes /tmp/fedomakase-part.cfg,
# which is consumed by the %include below (the documented Red Hat pattern for
# %pre-generated partitioning includes). Everything user-chosen (keyboard,
# disk, LUKS, username, password, hostname, timezone) flows through that
# include — there are NO hardcoded credentials in this file. If %pre fails,
# install aborts loudly.

# System Language (keyboard, timezone, and network/hostname come from %include)
lang en_US.UTF-8

# Text mode so errors are visible on console instead of hidden behind GUI
text
firstboot --disable
reboot

# Software Repositories (synced with install/omarchy-fedora-copr.repos)
url --mirrorlist="https://mirrors.fedoraproject.org/mirrorlist?repo=fedora-44&arch=x86_64"
repo --name="fedora-updates" --mirrorlist="https://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f44&arch=x86_64"
repo --name="copr-nett00n" --baseurl="https://copr-be.cloud.fedoraproject.org/results/nett00n/hyprland/fedora-44-x86_64/"
repo --name="copr-whelanh" --baseurl="https://copr-be.cloud.fedoraproject.org/results/whelanh/omarchy/fedora-44-x86_64/"
repo --name="copr-ghostty" --baseurl="https://copr-be.cloud.fedoraproject.org/results/scottames/ghostty/fedora-44-x86_64/"
repo --name="copr-atim-starship" --baseurl="https://copr-be.cloud.fedoraproject.org/results/atim/starship/fedora-44-x86_64/"
repo --name="copr-boobaa-lazygit" --baseurl="https://copr-be.cloud.fedoraproject.org/results/boobaa/lazygit/fedora-44-x86_64/"
repo --name="copr-jdxcode-mise" --baseurl="https://copr-be.cloud.fedoraproject.org/results/jdxcode/mise/fedora-44-x86_64/"
repo --name="copr-anudeepd-localsend" --baseurl="https://copr-be.cloud.fedoraproject.org/results/anudeepd/localsend/fedora-44-x86_64/"
repo --name="copr-brycensranch-gsr" --baseurl="https://copr-be.cloud.fedoraproject.org/results/brycensranch/gpu-screen-recorder-git/fedora-44-x86_64/"
repo --name="copr-lecris-moonlight" --baseurl="https://copr-be.cloud.fedoraproject.org/results/lecris/moonlight/fedora-44-x86_64/"
repo --name="copr-alternateved-keyd" --baseurl="https://copr-be.cloud.fedoraproject.org/results/alternateved/keyd/fedora-44-x86_64/"

# -------------------------------------------------------------------------
# PRE-INSTALL: interactive Gum UI on TTY3 gathers all user choices and
# writes /tmp/fedomakase-part.cfg (consumed by %include below).
# -------------------------------------------------------------------------
%pre --interpreter=/bin/bash --erroronfail
echo "[Fedomakase] %pre started at $(date)" > /tmp/fedomakase-pre.log
echo "[Fedomakase] Kernel cmdline: $(cat /proc/cmdline)" >> /tmp/fedomakase-pre.log

if [ -c /dev/tty3 ]; then
    exec < /dev/tty3 > /dev/tty3 2>&1
    chvt 3
fi
printf '\033[2J\033[H'

export TERM=linux
INSTALLER_PATH=""
for path in \
  /run/install/repo/omarchy-fedora/installer/omarchy-installer.sh \
  /run/install/source/omarchy-fedora/installer/omarchy-installer.sh \
  /run/install/isodir/omarchy-fedora/installer/omarchy-installer.sh \
  /run/install/sources/mount-0000-cdrom/omarchy-fedora/installer/omarchy-installer.sh; do
  if [ -f "$path" ]; then
    INSTALLER_PATH="$path"
    break
  fi
done

if [ -z "$INSTALLER_PATH" ]; then
  STAGE2_URL=$(sed -n 's/.*inst\.stage2=\([^ ]*\).*/\1/p' /proc/cmdline | head -n 1)
  case "$STAGE2_URL" in
    http://*|https://*)
      echo "Fetching omarchy-fedora payload from $STAGE2_URL/omarchy-fedora.tar.gz..."
      mkdir -p /run/install/repo
      if curl -fsSL "$STAGE2_URL/omarchy-fedora.tar.gz" | tar -xz -C /run/install/repo; then
        find /run/install/repo/omarchy-fedora \( -name "._*" -o -name ".DS_Store" \) -delete 2>/dev/null || true
        INSTALLER_PATH="/run/install/repo/omarchy-fedora/installer/omarchy-installer.sh"
      fi
      ;;
  esac
fi

if [ -n "$INSTALLER_PATH" ]; then
  export PATH="$PATH:$(dirname "$INSTALLER_PATH")"
  if ! bash "$INSTALLER_PATH" && [ ! -s /tmp/fedomakase-part.cfg ]; then
    echo "Installer was aborted or failed. Rebooting in 5 seconds..."
    sleep 5
    reboot
  fi
else
  echo "Installer script not found in any standard Anaconda mount paths (/run/install/*)"
  sleep 5
  poweroff -f
fi

# Sanity: the include file MUST exist or the kickstart cannot continue
if [ ! -s /tmp/fedomakase-part.cfg ]; then
  echo "ERROR: installer did not produce /tmp/fedomakase-part.cfg"
  sleep 5
  reboot
fi

chvt 1
%end

# Keyboard / timezone / network / partitioning / disk / user — determined by Gum choices.
%include /tmp/fedomakase-part.cfg

bootloader --timeout=1 --append="quiet rhgb systemd.tty.term.console=dumb plymouth.enable=1"
rootpw --lock

# -------------------------------------------------------------------------
# PACKAGES
# The block between the FEDOMAKASE markers is regenerated by
# build/build-netinstall-iso.sh from install/omarchy-fedora-base.packages
# (resolved against live repos at build time). Do not edit between markers.
# -------------------------------------------------------------------------
%packages
# >>> FEDOMAKASE-PACKAGES-BEGIN
@core
@hardware-support
kernel-modules-extra
linux-firmware
flashrom
gdisk
parted
cryptsetup
tpm2-tools
kernel-devel
elfutils-libelf-devel
android-tools
openssh-server
# >>> FEDOMAKASE-PACKAGES-END
%end

# -------------------------------------------------------------------------
# POST-INSTALL (NO CHROOT): copy payload + Gum choices into the target system
# -------------------------------------------------------------------------
%post --nochroot --log=/mnt/sysimage/var/log/fedomakase-copy.log
echo "[Fedomakase] Copying Omarchy payload from ISO to sysimage..."
PAYLOAD_SRC=""
for dir in \
  /run/install/repo/omarchy-fedora \
  /run/install/source/omarchy-fedora \
  /run/install/isodir/omarchy-fedora \
  /run/install/sources/mount-0000-cdrom/omarchy-fedora; do
  if [ -d "$dir" ]; then
    PAYLOAD_SRC="$dir"
    break
  fi
done

if [ -n "$PAYLOAD_SRC" ]; then
  mkdir -p /mnt/sysimage/usr/share/omarchy
  cp -rf "$PAYLOAD_SRC"/. /mnt/sysimage/usr/share/omarchy/
  # Strip any macOS AppleDouble / Finder metadata files if the ISO was prepared on macOS
  find /mnt/sysimage/usr/share/omarchy \( -name "._*" -o -name ".DS_Store" \) -delete 2>/dev/null || true
else
  echo "WARNING: omarchy-fedora payload directory not found on install media!"
fi

# Relay Gum choices into the chroot for %post (chroot) consumption
if [ -f /tmp/fedomakase-part.cfg ]; then
  cp /tmp/fedomakase-part.cfg /mnt/sysimage/root/fedomakase-part.cfg
fi
if [ -f /tmp/fedomakase-pre.log ]; then
  cp /tmp/fedomakase-pre.log /mnt/sysimage/root/fedomakase-pre.log || true
fi
if [ -f /tmp/fedomakase-input-method ]; then
  mkdir -p /mnt/sysimage/etc/omarchy
  cp /tmp/fedomakase-input-method /mnt/sysimage/etc/omarchy/input-method
  chmod 644 /mnt/sysimage/etc/omarchy/input-method
fi
if [ -f /tmp/fedomakase-git-identity ]; then
  cp /tmp/fedomakase-git-identity /mnt/sysimage/root/fedomakase-git-identity
  chmod 600 /mnt/sysimage/root/fedomakase-git-identity
fi
# LUKS passphrase (only exists if encryption was chosen) — needed once by
# systemd-cryptenroll in chrooted %post, wiped immediately afterwards.
if [ -f /tmp/fedomakase-luks-pass ]; then
  cp /tmp/fedomakase-luks-pass /mnt/sysimage/root/fedomakase-luks-pass
  chmod 600 /mnt/sysimage/root/fedomakase-luks-pass
fi
%end

# -------------------------------------------------------------------------
# POST-INSTALL (CHROOT): configure the installed system (1-to-1 with Arch Omarchy)
# -------------------------------------------------------------------------
%post --log=/var/log/fedomakase-install.log

echo "[Fedomakase] Starting post-install configuration..."

CHOICE_FILE="/root/fedomakase-part.cfg"
CHOSEN_USER="omarchy"
if [ -f "$CHOICE_FILE" ]; then
  CHOSEN_USER=$(sed -n 's/^user .*--name=\([^ ]*\).*/\1/p' "$CHOICE_FILE" | head -n 1)
  [ -z "$CHOSEN_USER" ] && CHOSEN_USER="omarchy"
fi
echo "[Fedomakase] Chosen user: $CHOSEN_USER"

OMARCHY_USER_NAME=""
OMARCHY_USER_EMAIL=""
if [ -f /root/fedomakase-git-identity ]; then
  # shellcheck disable=SC1091
  source /root/fedomakase-git-identity || true
  rm -f /root/fedomakase-git-identity
fi
export OMARCHY_USER_NAME OMARCHY_USER_EMAIL

# 1. Enable System Services
systemctl enable sddm.service
systemctl enable NetworkManager.service
systemctl enable bluetooth.service
systemctl enable docker.service 2>/dev/null || true
systemctl enable docker.socket
systemctl enable power-profiles-daemon.service
systemctl enable cups.service
systemctl enable avahi-daemon.service
systemctl enable systemd-resolved.service
systemctl enable systemd-oomd.service 2>/dev/null || true
systemctl enable firewalld.service 2>/dev/null || true
systemctl mask NetworkManager-wait-online.service
systemctl set-default graphical.target

# 2. Configure Flathub & Third-Party Workstation Repos (Chrome, Steam, NVIDIA)
mkdir -p /var/lib/flatpak/exports/share/applications /var/lib/flatpak/exports/share/icons \
         /etc/skel/.local/share/flatpak/exports/share/applications /etc/skel/.local/share/flatpak/exports/share/icons
flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo 2>/dev/null || true
[ -f /etc/yum.repos.d/google-chrome.repo ] && sed -i 's/enabled=0/enabled=1/g' /etc/yum.repos.d/google-chrome.repo || true
[ -f /etc/yum.repos.d/rpmfusion-nonfree-steam.repo ] && sed -i '0,/enabled=0/s/enabled=0/enabled=1/' /etc/yum.repos.d/rpmfusion-nonfree-steam.repo || true
[ -f /etc/yum.repos.d/rpmfusion-nonfree-nvidia-driver.repo ] && sed -i '0,/enabled=0/s/enabled=0/enabled=1/' /etc/yum.repos.d/rpmfusion-nonfree-nvidia-driver.repo || true

# 3. Seed Omarchy System & User Files (1-to-1 with omarchy + omarchy-settings + omarchy-nvim PKGBUILDs)
if [ -d /usr/share/omarchy ]; then
  OMARCHY="/usr/share/omarchy"
  chmod +x "$OMARCHY"/bin/* "$OMARCHY"/installer/* 2>/dev/null || true
  for b in "$OMARCHY"/bin/*; do
    [ -f "$b" ] && ln -sf "$b" "/usr/bin/$(basename "$b")"
  done
  ln -sf /usr/bin/omarchy-nvim-setup /usr/bin/omarchy-nvim-refresh 2>/dev/null || true
  ln -sf "$OMARCHY/bin/omarchy" /usr/local/bin/omarchy
  ln -sf "$OMARCHY/bin/uwsm-app" /usr/local/bin/uwsm-app

  # System drop-ins (/etc + /etc-overrides)
  if [ -d "$OMARCHY/etc" ]; then
    cp -rf "$OMARCHY/etc"/. /etc/
  fi
  if [ -d "$OMARCHY/etc-overrides" ]; then
    [ -f "$OMARCHY/etc-overrides/security/faillock.conf" ] && install -Dm644 "$OMARCHY/etc-overrides/security/faillock.conf" /etc/security/faillock.conf
    [ -f "$OMARCHY/etc-overrides/nsswitch.conf" ] && install -Dm644 "$OMARCHY/etc-overrides/nsswitch.conf" /etc/nsswitch.conf
    [ -f "$OMARCHY/etc-overrides/plymouth/plymouthd.conf" ] && install -Dm644 "$OMARCHY/etc-overrides/plymouth/plymouthd.conf" /etc/plymouth/plymouthd.conf
    [ -f "$OMARCHY/etc-overrides/skel/.bashrc" ] && install -Dm644 "$OMARCHY/etc-overrides/skel/.bashrc" /etc/skel/.bashrc
  fi

  # SDDM theme + minimal Wayland greeter Hyprland config
  if [ -d "$OMARCHY/default/sddm/omarchy" ]; then
    mkdir -p /usr/share/sddm/themes/omarchy
    cp -rf "$OMARCHY/default/sddm/omarchy"/. /usr/share/sddm/themes/omarchy/
  fi
  if [ -f "$OMARCHY/default/sddm/hyprland.lua" ]; then
    install -Dm644 "$OMARCHY/default/sddm/hyprland.lua" /usr/share/sddm/hyprland.lua
  fi

  # Wayland sessions (uwsm-managed omarchy.desktop + ensure hyprland.desktop uses start-hyprland)
  if [ -d "$OMARCHY/default/wayland-sessions" ]; then
    mkdir -p /usr/share/wayland-sessions
    cp -rf "$OMARCHY/default/wayland-sessions"/. /usr/share/wayland-sessions/
  fi
  if [ -f /usr/share/wayland-sessions/hyprland.desktop ]; then
    sed -i 's|^Exec=Hyprland$|Exec=start-hyprland|' /usr/share/wayland-sessions/hyprland.desktop 2>/dev/null || true
  fi

  # UWSM & environment.d drop-ins
  [ -f "$OMARCHY/default/uwsm/env.d/10-omarchy" ] && install -Dm644 "$OMARCHY/default/uwsm/env.d/10-omarchy" /usr/share/uwsm/env.d/10-omarchy
  [ -f "$OMARCHY/default/environment.d/10-omarchy-fcitx.conf" ] && install -Dm644 "$OMARCHY/default/environment.d/10-omarchy-fcitx.conf" /usr/lib/environment.d/10-omarchy-fcitx.conf

  # Plymouth theme
  if [ -d "$OMARCHY/default/plymouth" ]; then
    mkdir -p /usr/share/plymouth/themes/omarchy
    cp -rf "$OMARCHY/default/plymouth"/. /usr/share/plymouth/themes/omarchy/
    plymouth-set-default-theme omarchy 2>/dev/null || true
  fi

  # Fonts & fontconfig defaults
  if [ -d "$OMARCHY/default/fonts" ]; then
    mkdir -p /usr/share/fonts/omarchy
    cp -rf "$OMARCHY/default/fonts"/. /usr/share/fonts/omarchy/ 2>/dev/null || true
    fc-cache -f 2>/dev/null || true
  fi
  if [ -f "$OMARCHY/default/fontconfig/conf.avail/50-omarchy.conf" ]; then
    install -Dm644 "$OMARCHY/default/fontconfig/conf.avail/50-omarchy.conf" /usr/share/fontconfig/conf.avail/50-omarchy.conf
    mkdir -p /etc/fonts/conf.d
    ln -sf /usr/share/fontconfig/conf.avail/50-omarchy.conf /etc/fonts/conf.d/50-omarchy.conf
  fi

  # System-wide application entries & icons
  if [ -d "$OMARCHY/default/applications" ]; then
    mkdir -p /usr/share/applications
    cp -rf "$OMARCHY/default/applications"/. /usr/share/applications/ 2>/dev/null || true
  fi
  [ -f "$OMARCHY/icon.png" ] && install -Dm644 "$OMARCHY/icon.png" /usr/share/pixmaps/omarchy.png
  if [ -d "$OMARCHY/applications/icons" ]; then
    mkdir -p /usr/share/icons/hicolor/256x256/apps /usr/share/icons/hicolor/48x48/apps /usr/share/icons/hicolor/scalable/apps
    if command -v magick &>/dev/null; then
      for icon in "$OMARCHY"/applications/icons/*.png; do
        [ -f "$icon" ] || continue
        magick "$icon" -resize 256x256 "/usr/share/icons/hicolor/256x256/apps/$(basename "$icon")" 2>/dev/null || true
        magick "$icon" -resize 48x48 "/usr/share/icons/hicolor/48x48/apps/$(basename "$icon")" 2>/dev/null || true
      done
    fi
    for icon in "$OMARCHY"/applications/icons/*.svg; do
      [ -f "$icon" ] && install -Dm644 "$icon" "/usr/share/icons/hicolor/scalable/apps/$(basename "$icon")"
    done
    gtk-update-icon-cache -f /usr/share/icons/hicolor 2>/dev/null || true
  fi

  # Default terminal preference for xdg-terminal-exec
  if [ -f "$OMARCHY/default/xdg-terminal-exec/hyprland-xdg-terminals.list" ]; then
    install -Dm644 "$OMARCHY/default/xdg-terminal-exec/hyprland-xdg-terminals.list" /usr/share/xdg-terminal-exec/hyprland-xdg-terminals.list
    install -Dm644 "$OMARCHY/default/xdg-terminal-exec/hyprland-xdg-terminals.list" /etc/xdg/xdg-terminals.list
  fi

  # Systemd user units, system drop-ins, sleep hooks, and snapper template
  for u in "$OMARCHY"/default/systemd/user/*.service; do
    [ -f "$u" ] && install -Dm644 "$u" "/usr/lib/systemd/user/$(basename "$u")"
  done
  [ -f "$OMARCHY/default/systemd/user/app.slice.d/10-oomd.conf" ] && install -Dm644 "$OMARCHY/default/systemd/user/app.slice.d/10-oomd.conf" /usr/lib/systemd/user/app.slice.d/10-oomd.conf
  [ -f "$OMARCHY/default/systemd/system/plocate-updatedb.service.d/10-omarchy.conf" ] && install -Dm644 "$OMARCHY/default/systemd/system/plocate-updatedb.service.d/10-omarchy.conf" /usr/lib/systemd/system/plocate-updatedb.service.d/10-omarchy.conf
  [ -f "$OMARCHY/default/systemd/zram-generator.conf.d/90-omarchy.conf" ] && install -Dm644 "$OMARCHY/default/systemd/zram-generator.conf.d/90-omarchy.conf" /usr/lib/systemd/zram-generator.conf.d/90-omarchy.conf
  [ -f "$OMARCHY/default/systemd/system-sleep/unmount-fuse" ] && install -Dm755 "$OMARCHY/default/systemd/system-sleep/unmount-fuse" /usr/lib/systemd/system-sleep/unmount-fuse
  [ -f "$OMARCHY/default/snapper/root" ] && install -Dm644 "$OMARCHY/default/snapper/root" /etc/snapper/config-templates/omarchy

  # Seed /etc/skel (matching omarchy + omarchy-nvim PKGBUILDs)
  mkdir -p /etc/skel/.config /etc/skel/.config/autostart /etc/skel/.config/omarchy/branding \
           /etc/skel/.local/state/omarchy/toggles/hypr /etc/skel/.local/share/nautilus-python/extensions \
           /etc/skel/.local/state/tensaku /etc/skel/.local/share/applications
  cp -rf "$OMARCHY/config"/. /etc/skel/.config/
  [ -f "$OMARCHY/default/bashrc" ] && cp -f "$OMARCHY/default/bashrc" /etc/skel/.bashrc
  [ -f "$OMARCHY/logo.txt" ] && cp -f "$OMARCHY/logo.txt" /etc/skel/.config/omarchy/branding/screensaver.txt
  [ -f "$OMARCHY/icon.txt" ] && cp -f "$OMARCHY/icon.txt" /etc/skel/.config/omarchy/branding/about.txt
  [ -f "$OMARCHY/default/hypr/toggle_defaults.lua" ] && cp -f "$OMARCHY/default/hypr/toggle_defaults.lua" /etc/skel/.local/state/omarchy/toggles/hypr/flags.lua
  [ -f "$OMARCHY/default/nautilus-python/extensions/localsend.py" ] && cp -f "$OMARCHY/default/nautilus-python/extensions/localsend.py" /etc/skel/.local/share/nautilus-python/extensions/localsend.py
  [ -f "$OMARCHY/default/nautilus-python/extensions/transcode.py" ] && cp -f "$OMARCHY/default/nautilus-python/extensions/transcode.py" /etc/skel/.local/share/nautilus-python/extensions/transcode.py
  [ -f "$OMARCHY/default/tensaku/state.toml" ] && cp -f "$OMARCHY/default/tensaku/state.toml" /etc/skel/.local/state/tensaku/state.toml
  if [ -d "$OMARCHY/default/nvim" ]; then
    mkdir -p /usr/share/omarchy-nvim
    cp -rf "$OMARCHY/default/nvim" /usr/share/omarchy-nvim/config
    cp -rf "$OMARCHY/default/nvim" /etc/skel/.config/nvim
    mkdir -p /etc/skel/.config/nvim/lua/plugins
    ln -snf ../../../../.local/state/omarchy/current/theme/neovim.lua /etc/skel/.config/nvim/lua/plugins/theme.lua
  fi
  cat << 'AUTOSTART_EOF' > /etc/skel/.config/autostart/omarchy-first-run.desktop
[Desktop Entry]
Type=Application
Name=Omarchy First Run Setup
Exec=/usr/share/omarchy/bin/omarchy-provision-first-run
Hidden=false
NoDisplay=true
X-GNOME-Autostart-enabled=true
AUTOSTART_EOF
  chmod -R a+rX /etc/skel

  # Run Omarchy system-wide config & hardware leaves
  export OMARCHY_PATH=/usr/share/omarchy
  export OMARCHY_INSTALL=/usr/share/omarchy/install
  export PATH="/usr/share/omarchy/bin:$PATH"
  if [ -x /usr/share/omarchy/bin/omarchy-apply-system ]; then
    /usr/share/omarchy/bin/omarchy-apply-system --install-user "$CHOSEN_USER" --first-install || true
  fi

  # Apply Fedora patches & install self-healing post-update hook stash
  if [ -x /usr/share/omarchy/bin/omarchy-apply-fedora-patches ]; then
    /usr/share/omarchy/bin/omarchy-apply-fedora-patches || true
  fi

  # Per-user config seeding + omarchy-provision-user + omarchy-nvim-setup + fedomakase update stash
  touch /var/log/omarchy-install.log
  chmod 666 /var/log/omarchy-install.log 2>/dev/null || true
  for user_dir in /home/*; do
    [ -d "$user_dir" ] || continue
    user_name=$(basename "$user_dir")
    [ "$user_name" = "lost+found" ] && continue
    cp -rf /etc/skel/. "$user_dir/"
    if [ -d "$OMARCHY/applications" ]; then
      mkdir -p "$user_dir/.local/share/applications" "$user_dir/.local/share/icons"
      cp -rf "$OMARCHY/applications"/*.desktop "$user_dir/.local/share/applications/" 2>/dev/null || true
      cp -rf "$OMARCHY/applications/icons" "$user_dir/.local/share/icons/" 2>/dev/null || true
    fi
    if [ -d "$OMARCHY/fedora-patches" ]; then
      mkdir -p "$user_dir/.local/share/fedomakase/bin" "$user_dir/.local/share/fedomakase/fedora-patches" "$user_dir/.config/omarchy/hooks/post-update.d"
      cp -f "$OMARCHY/bin/omarchy-apply-fedora-patches" "$user_dir/.local/share/fedomakase/bin/" 2>/dev/null || true
      cp -rf "$OMARCHY/fedora-patches"/. "$user_dir/.local/share/fedomakase/fedora-patches/" 2>/dev/null || true
      cp -f "$OMARCHY/fedora-patches/apply-fedora-patches.hook" "$user_dir/.config/omarchy/hooks/post-update.d/apply-fedora-patches.hook" 2>/dev/null || true
      chmod +x "$user_dir/.config/omarchy/hooks/post-update.d/apply-fedora-patches.hook" 2>/dev/null || true
    fi
    chown -R "$user_name:$user_name" "$user_dir" 2>/dev/null || true
    if [ -x /usr/share/omarchy/bin/omarchy-provision-user ]; then
      su - "$user_name" -c "OMARCHY_PATH=/usr/share/omarchy OMARCHY_INSTALL_LOG_FILE=/var/log/omarchy-install.log OMARCHY_USER_NAME=\"$OMARCHY_USER_NAME\" OMARCHY_USER_EMAIL=\"$OMARCHY_USER_EMAIL\" PATH=/usr/share/omarchy/bin:\$PATH /usr/share/omarchy/bin/omarchy-provision-user --force --first-install" || true
    fi
    if [ -x /usr/share/omarchy/bin/omarchy-nvim-setup ]; then
      su - "$user_name" -c "OMARCHY_PATH=/usr/share/omarchy PATH=/usr/share/omarchy/bin:\$PATH /usr/share/omarchy/bin/omarchy-nvim-setup" || true
    fi
  done
  chmod 644 /var/log/omarchy-install.log 2>/dev/null || true
fi

# 4. Configure SDDM login & autologin (matching upstream phases_impl.py:configure_login)
mkdir -p /etc/sddm.conf.d /var/lib/sddm
cat << 'SDDM_LOGIN_EOF' > /etc/sddm.conf.d/99-omarchy-login.conf
[Theme]
Current=omarchy

[Users]
RememberLastUser=true
RememberLastSession=true
SDDM_LOGIN_EOF

if [ -f /root/fedomakase-luks-pass ] || lsblk -o FSTYPE -dn 2>/dev/null | grep -q crypto_LUKS; then
  cat << SDDM_AUTO_EOF > /etc/sddm.conf.d/autologin.conf
[Autologin]
User=${CHOSEN_USER}
Session=omarchy.desktop
SDDM_AUTO_EOF
else
  rm -f /etc/sddm.conf.d/autologin.conf
fi

cat << SDDM_STATE_EOF > /var/lib/sddm/state.conf
[Last]
User=${CHOSEN_USER}
Session=/usr/share/wayland-sessions/omarchy.desktop
SDDM_STATE_EOF
chown -R sddm:sddm /var/lib/sddm 2>/dev/null || true

# 5. Bootloader: quiet 1s hidden GRUB timeout + reboot-boot-menu sudoers rule + UEFI fallback
if [ -f /etc/default/grub ]; then
  sed -i 's/^GRUB_TIMEOUT=.*/GRUB_TIMEOUT=1/' /etc/default/grub
  if grep -q '^GRUB_TIMEOUT_STYLE=' /etc/default/grub; then
    sed -i 's/^GRUB_TIMEOUT_STYLE=.*/GRUB_TIMEOUT_STYLE=hidden/' /etc/default/grub
  else
    echo 'GRUB_TIMEOUT_STYLE=hidden' >> /etc/default/grub
  fi
  grub2-mkconfig -o /boot/grub2/grub.cfg 2>/dev/null || true
fi
if [ -d /boot/efi/EFI/fedora ]; then
  mkdir -p /boot/efi/EFI/BOOT
  [ -f /boot/efi/EFI/fedora/shimx64.efi ] && cp -f /boot/efi/EFI/fedora/shimx64.efi /boot/efi/EFI/BOOT/BOOTX64.EFI
  [ -f /boot/efi/EFI/fedora/grubx64.efi ] && cp -f /boot/efi/EFI/fedora/grubx64.efi /boot/efi/EFI/BOOT/grubx64.efi
  [ -f /boot/efi/EFI/fedora/mmx64.efi ] && cp -f /boot/efi/EFI/fedora/mmx64.efi /boot/efi/EFI/BOOT/mmx64.efi
  [ ! -f /boot/efi/EFI/BOOT/BOOTX64.EFI ] && [ -f /boot/efi/EFI/fedora/grubx64.efi ] && cp -f /boot/efi/EFI/fedora/grubx64.efi /boot/efi/EFI/BOOT/BOOTX64.EFI
fi
mkdir -p /etc/sudoers.d
echo '%wheel ALL=(root) NOPASSWD: /usr/bin/grub2-editenv - set menu_show_once=1' > /etc/sudoers.d/omarchy-grub-bootmenu
chmod 0440 /etc/sudoers.d/omarchy-grub-bootmenu

# 6. Nerd Font for QuickShell glyphs (JetBrains Mono NF not packaged in Fedora).
# shortcut: GitHub fetch instead of a COPR guess, swap to an RPM when one lands
NF_DIR="/usr/share/fonts/omarchy/JetBrainsMono-NF"
if [ ! -d "$NF_DIR" ]; then
  if [ -d /usr/share/omarchy/installer/fonts/JetBrainsMono-NF ]; then
    mkdir -p "$NF_DIR"
    cp -rf /usr/share/omarchy/installer/fonts/JetBrainsMono-NF/. "$NF_DIR/"
    fc-cache -f 2>/dev/null || true
  else
    echo "[Fedomakase] Fetching JetBrains Mono Nerd Font..."
    mkdir -p "$NF_DIR"
    curl -fsSL --max-time 60 \
      "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.tar.xz" \
      | tar -xJ -C "$NF_DIR" 2>/dev/null \
      && fc-cache -f 2>/dev/null \
      || echo "WARNING: Nerd Font download failed — icons may render blank until installed."
  fi
fi

# 7. TPM2 auto-unlock binding (only possible if LUKS was actually chosen)
echo "[Fedomakase] Checking for LUKS volume to bind to TPM2..."
luks_partition=$(lsblk -o NAME,FSTYPE -dn 2>/dev/null | grep crypto_LUKS | awk '{print $1}' | head -n 1)
if [ -n "$luks_partition" ]; then
  if [ -e /dev/tpmrm0 ]; then
    echo "Found encrypted partition /dev/$luks_partition — binding to TPM2 (PCRs 0+7)..."
    if systemctl is-active --quiet tpm2.target 2>/dev/null || [ -c /dev/tpmrm0 ]; then
      systemd-cryptenroll --tpm2-device=auto --tpm2-pcrs=0+7 \
        --unlock-keyfile=/root/fedomakase-luks-pass "/dev/$luks_partition" \
        && echo "TPM2 enrollment OK" \
        || echo "WARNING: TPM2 enrollment failed — passphrase prompt remains at boot."
    fi
    mkdir -p /etc/dracut.conf.d
    echo 'add_dracutmodules+=" tpm2-tss "' > /etc/dracut.conf.d/tpm2.conf
    if [ -f /etc/crypttab ]; then
      luks_uuid=$(cryptsetup luksUUID "/dev/$luks_partition" 2>/dev/null || true)
      if [ -n "$luks_uuid" ] && ! grep -q "tpm2-device" /etc/crypttab; then
        sed -i "/$luks_uuid/s/$/ tpm2-device=auto/" /etc/crypttab
      fi
    fi
    dracut -f --regenerate-all || true
  else
    echo "No TPM2 device found — LUKS will prompt for passphrase at boot."
    echo "Enable TPM2 in BIOS/UEFI, then run: sudo omarchy-setup-tpm2-unlock"
  fi
  rm -f /root/fedomakase-luks-pass /tmp/fedomakase-luks-pass 2>/dev/null || true
fi

# 8. locate: index Btrfs subvolumes, skip /.snapshots (keep inside quotes)
if [ -f /etc/updatedb.conf ]; then
  sed -i -E 's|^[[:space:]]*PRUNE_BIND_MOUNTS[[:space:]]*=.*|PRUNE_BIND_MOUNTS = "no"|' /etc/updatedb.conf 2>/dev/null || true
  if ! grep -q '/.snapshots' /etc/updatedb.conf 2>/dev/null; then
    sed -i -E 's|^([[:space:]]*PRUNEPATHS[[:space:]]*=[[:space:]]*"[^"]*)"|\1 /.snapshots"|' /etc/updatedb.conf 2>/dev/null || true
  fi
fi

echo "[Fedomakase] Post-install configuration complete!"
%end

# Googlebook / depthcharge: pack the installed kernel into Android Slot B of the target disk
%post --log=/var/log/fedomakase-googlebook-slotb.log
if grep -qi coreboot /sys/class/dmi/id/bios_vendor 2>/dev/null && [ -x /usr/share/omarchy/bin/fedomakase-googlebook-slotb ]; then
  /usr/share/omarchy/bin/fedomakase-googlebook-slotb || echo "[googlebook-slotb] FAILED (non-fatal); re-run after first boot"
fi
%end
